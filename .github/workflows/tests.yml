name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  quality:
    # 唯一质量门（python-quality-gate skill）：格式 / lint+类型棘轮 / 分支覆盖率。
    # 本地与 CI 跑的是**同一个文件** scripts/quality.sh，两边不会漂移。
    # 这里只跑一个 Python 版本：门验的是"代码是否合格"，
    # 跨版本兼容由下面的 test 矩阵负责。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev tools (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Quality gate
        run: ./scripts/quality.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Unit tests (zero-dependency runner)
        run: python tests/test_fetchers.py

      - name: Unit tests (unittest discovery)
        run: python -m unittest discover -s tests -v

      - name: Smoke — console entrypoint
        run: mpdt --help

      - name: Smoke — module entrypoint
        run: python -m mpdt --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q mpdt tests tools

      # 轻量级：只编译检查，不引入 ruff/black 风格争论

  version-gate:
    # R113 e1 rule: dual-file version (pyproject + __init__) must stay in sync
    # and never regress below an existing tag. Triggered on PRs only — on a
    # PR, "version == an existing tag" is allowed (docs/CI-only changes must
    # not be forced to bump); only mismatch or regression fails.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for the monotonic check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Version gate — dual-file sync + no regression below tag
        env:
          GATE_ALLOW_EQ: "1"  # PRs may keep version == existing tag; only regression/mismatch fails
        run: python tools/version_gate.py


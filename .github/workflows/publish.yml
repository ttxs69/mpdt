name: publish

# A release is a pushed semver tag, and nothing else. There is no manual path
# that publishes: `workflow_dispatch` below is a dry run that builds and
# verifies without uploading, so a human can rehearse the release and see the
# artifact without the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Two tags pushed in quick succession must not race to upload. A release in
  # flight finishes; a second one waits rather than interleaving.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The whole gate, on the matrix, before anything is built. A release is not
  # the place to discover a 3.10-only failure.
  test-first:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    needs: test-first
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The version being released
        id: version
        run: |
          # On a tag push the tag is the authority; a dispatch has no tag, so
          # it uses what the tree says and says so.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "source=tag ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            echo "source=pyproject.toml (dry run, no tag)" >> "$GITHUB_OUTPUT"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION}"

      - name: Install build tooling (pinned)
        run: |
          python -m pip install --upgrade pip
          # Pinned: the build tool must not change between the gate and the
          # artifact. `build` decides what goes in the wheel.
          python -m pip install "build==1.6.1" "twine==7.0.0"

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: python -m twine check --strict dist/*

      - name: The artifact is what we think it is
        # twine checks metadata. This checks the files: no tests, no caches, no
        # dev tooling in the wheel; sdist and wheel agree byte for byte; the
        # version in METADATA and in `__init__` match the release.
        run: |
          python tools/verify_artifact.py dist \
            --expect-version "${{ steps.version.outputs.value }}"

      - name: Install the wheel in a clean venv and run it
        # Installing from the source tree proves the source works. This proves
        # the *artifact* works — a missing module or a package-data gap only
        # shows up here.
        run: |
          python -m venv /tmp/artifact-check
          /tmp/artifact-check/bin/pip install --quiet --upgrade pip
          /tmp/artifact-check/bin/pip install --quiet dist/*.whl
          /tmp/artifact-check/bin/mpdt --version
          /tmp/artifact-check/bin/mpdt --help > /dev/null
          /tmp/artifact-check/bin/python -m mpdt --help > /dev/null
          EXPECTED="${{ steps.version.outputs.value }}"
          GOT="$(/tmp/artifact-check/bin/mpdt --version | awk '{print $NF}')"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::the installed CLI reports ${GOT}, the release is ${EXPECTED}"
            exit 1
          fi
          echo "installed artifact reports ${GOT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # A dispatch is a rehearsal: build, verify, install, stop.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # id-token is the OIDC exchange with PyPI; there is no API token in this
      # repository and no secret for one to live in.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Attestations are what make the upload verifiable after the fact;
          # they are on by default and stated here so nobody turns them off
          # without noticing.
          attestations: true

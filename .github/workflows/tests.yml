name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  quality:
    # 唯一质量门（python-quality-gate skill）：格式 / lint+类型棘轮 / 分支覆盖率。
    # 本地与 CI 跑的是**同一个文件** scripts/quality.sh，两边不会漂移。
    # 这里只跑一个 Python 版本：门验的是"代码是否合格"，
    # 跨版本兼容由下面的 test 矩阵负责。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + dev tools (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Quality gate
        run: ./scripts/quality.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Unit tests (zero-dependency runner)
        run: python tests/test_fetchers.py

      - name: Unit tests (unittest discovery)
        run: python -m unittest discover -s tests -v

      - name: Smoke — console entrypoint
        run: mpdt --help

      - name: Smoke — module entrypoint
        run: python -m mpdt --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q mpdt tests tools

      # 轻量级：只编译检查，不引入 ruff/black 风格争论

  version-gate:
    # R113 e1 rule: dual-file version (pyproject + __init__) must stay in sync
    # and never regress below an existing tag.
    #
    # 触发面（2026-10-22 R68 修）：原来只在 PR 上跑 ⇒ **推 tag 发版时整条门被跳过**
    # （实测 publish 那次的 job 列表里 version-gate=skipped）。发版恰恰是最需要它的场合：
    # 包是从源码树构建的，tag 是另一个对象，两者对不上时没有任何环节会发现。
    #
    # 现在 PR 与 tag 推送都跑：
    #   - PR：允许 version == 最高 tag（docs/CI-only 改动不该被迫 bump）
    #   - tag：额外要求 **tag 名 == 版本号**（GATE_EXPECT_TAG）
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tags needed for the monotonic check

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch tags
        # 为什么必须 --force（2026-10-22 实测）：
        # actions/checkout 把 tag 取成**轻量引用**，而仓库里的发版 tag 是 `git tag -a` 建的
        # **注解对象**；对象不同 ⇒ 裸 `git fetch --tags` 拒绝覆盖，报
        #   `! [rejected] v0.2.7-rc1 -> v0.2.7-rc1 (would clobber existing tag)` 并 exit 1，
        # 整条 version-gate 在跑脚本之前就红了。CI 里远端是唯一真相，强制对齐是对的。
        run: git fetch --tags --force origin

      - name: Version gate — dual-file sync + no regression below tag
        env:
          GATE_ALLOW_EQ: "1"  # PR / tag-push：version == 最高 tag 是正常的（tag 推送本身就是那个 tag）
          # 非 tag 事件时为空串 ⇒ 不启用 tag/版本一致性检查
          GATE_EXPECT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python tools/version_gate.py

